services:
  - type: web
    name: shadowgrid-cop-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m cops_robbers_ai.cop_server
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PUBLIC_URL
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: shadowgrid-thief-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m cops_robbers_ai.thief_server
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PUBLIC_URL
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
